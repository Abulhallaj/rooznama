name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]   # each job produces: portable ZIP + installer + update packages (self-contained, no prerequisites)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs the full history and the tags to calculate the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish (self-contained, win-${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet publish Rooznama.csproj -c Release -r "win-${{ matrix.arch }}" `
            --self-contained `
            "-p:WindowsAppSDKSelfContained=true" `
            "-p:PlatformTarget=${{ matrix.arch }}" `
            "-p:SatelliteResourceLanguages=en%3Bfa" `
            -o "publish/${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      # The version is calculated by MinVer from the git tags (v0.7.0 -> 0.7.0); read it back from the built app.
      - name: Read version
        shell: pwsh
        run: |
          $info = (Get-Item "publish/${{ matrix.arch }}/Rooznama.dll").VersionInfo.ProductVersion
          $ver = $info -replace '\+.*$', ''
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $ver -ne $env:GITHUB_REF_NAME.Substring(1)) {
            throw "Tag $env:GITHUB_REF_NAME but the app was built as $ver (incomplete git history?)"
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Version: $ver"

      # Velopack: one pack per architecture gives the installer, the portable layout and the update packages (full + delta).
      # Every architecture has its own channel (win-x64 / win-x86), so each one updates only from its own feed.
      - name: Pack (Velopack, win-${{ matrix.arch }})
        shell: pwsh
        run: |
          # vpk must be the same version as the Velopack package the app was built with
          $vpkVer = (dotnet list Rooznama.csproj package --format json | ConvertFrom-Json).projects[0].frameworks[0].topLevelPackages |
            Where-Object id -eq 'Velopack' | ForEach-Object resolvedVersion
          if (-not $vpkVer) { throw "Velopack package version not found" }
          "Velopack package version: $vpkVer"
          dotnet tool install -g vpk --version $vpkVer
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $ch = "win-${{ matrix.arch }}"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # the previous release is needed to build the delta package; the first Velopack release has none
            vpk download github --repoUrl $repo --channel $ch --pre --token "${{ secrets.GITHUB_TOKEN }}"
            if ($LASTEXITCODE -ne 0) { Write-Host "No previous release to build a delta from"; $global:LASTEXITCODE = 0 }
          }
          vpk pack --packId Rooznama --packTitle Rooznama --packVersion $env:VERSION `
            --packDir "publish/${{ matrix.arch }}" --mainExe Rooznama.exe `
            --runtime $ch --channel $ch --icon Assets/Rooznama.ico --outputDir Releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }

      # dist = only what belongs to THIS release (the previous full package vpk downloaded stays out) + readable file names
      - name: Collect files (installer, portable ZIP, update packages)
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem Releases -File |
            Where-Object { $_.Extension -ne '.nupkg' -or $_.Name -like "*-$env:VERSION-*" } |
            Copy-Item -Destination dist

          $setup = Get-ChildItem dist -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found" }
          Rename-Item $setup.FullName "Rooznama-$env:VERSION-setup-$arch.exe"

          # portable: the ZIP holds one Rooznama folder; portable.flag goes next to Update.exe (the folder that contains "current"),
          # because "current" is replaced on every update
          $zip = Get-ChildItem dist -Filter '*-Portable.zip' | Select-Object -First 1
          if (-not $zip) { throw "Portable.zip not found" }
          $tmp = Join-Path $env:RUNNER_TEMP "portable-$arch"
          Expand-Archive $zip.FullName $tmp -Force
          $cur = Get-ChildItem $tmp -Recurse -Directory -Filter current | Select-Object -First 1
          if (-not $cur) { throw "no 'current' folder in the portable ZIP" }
          $stage = Join-Path $env:RUNNER_TEMP "stage-$arch"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $cur.Parent.FullName (Join-Path $stage 'Rooznama') -Recurse
          New-Item (Join-Path $stage 'Rooznama/portable.flag') -ItemType File | Out-Null
          Remove-Item $zip.FullName
          Compress-Archive -Path (Join-Path $stage 'Rooznama') -DestinationPath "dist/Rooznama-$env:VERSION-portable-$arch.zip"

      # separate artifacts (GitHub always downloads an artifact as a .zip; the Release page has the raw files)
      - uses: actions/upload-artifact@v4
        with:
          name: Rooznama-portable-${{ matrix.arch }}
          path: dist/*-portable-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Rooznama-setup-${{ matrix.arch }}
          path: dist/*-setup-${{ matrix.arch }}.exe

      # what the in-app updater reads: the feed (releases.<channel>.json) and this version's full / delta packages
      - uses: actions/upload-artifact@v4
        with:
          name: Rooznama-update-${{ matrix.arch }}
          path: |
            dist/*.nupkg
            dist/releases.*.json
            dist/assets.*.json
            dist/RELEASES*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.11.0-beta.1 -> pre-release (only beta versions follow those)
          